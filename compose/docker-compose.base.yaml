services:
  ferrite-postgres:
    image: docker.io/library/postgres:18-alpine
    container_name: ferrite-postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "wal_compression=on"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "synchronous_commit=${POSTGRES_SYNCHRONOUS_COMMIT:-local}"
      - "-c"
      - "wal_sender_timeout=60s"
    networks:
      - ferrite_network

  ferrite-redis-cache:
    image: docker.io/library/redis:8-alpine
    container_name: ferrite-redis-cache
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep -qx PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ferrite_network

  ferrite-redis-sessions:
    image: docker.io/library/redis:8-alpine
    container_name: ferrite-redis-sessions
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_SESSIONS_PORT:-6380}:6379"
    command: >
      redis-server
      --requirepass "${REDIS_SESSIONS_PASSWORD}"
      --maxmemory-policy noeviction
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_sessions_data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_SESSIONS_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep -qx PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ferrite_network

volumes:
  postgres_data:
  redis_data:
  redis_sessions_data:

networks:
  ferrite_network:
    driver: bridge
